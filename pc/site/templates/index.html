<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart OR Lighting Console</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      --bg-main: #05070b;
      --bg-panel: #0d1117;
      --bg-panel-alt: #111826;
      --accent: #1abc9c;          /* teal like imaging UIs */
      --accent-soft: rgba(26,188,156,0.4);
      --accent-strong: #00d8ff;
      --border-subtle: #222733;
      --text-main: #e5edf7;
      --text-muted: #8b97aa;
      --danger: #e74c3c;
      --success: #2ecc71;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top left, #111826 0, #05070b 40%, #000 100%);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* LEFT WORKLIST BAR */

    .sidebar {
      width: 280px;
      background: linear-gradient(to bottom, #070b12 0, #05070b 40%, #05070b 100%);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid var(--border-subtle);
    }

    .sidebar h1 {
      font-size: 15px;
      margin: 0 0 6px 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
    }

    .sidebar h2 {
      font-size: 13px;
      margin: 10px 0 4px 4px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .recordings-list {
      flex: 1;
      overflow-y: auto;
      background: rgba(7, 11, 18, 0.9);
      border-radius: 4px;
      padding: 6px;
      border: 1px solid var(--border-subtle);
      font-size: 12px;
    }

    .recording-item {
      padding: 6px 8px;
      margin-bottom: 4px;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #05070b;
      border: 1px solid #151a24;
      transition: background 0.15s, border-color 0.15s;
    }

    .recording-item:hover {
      background: #0f1724;
      border-color: var(--accent-soft);
    }

    .recording-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 160px;
      color: var(--text-main);
    }

    /* MAIN GRID */

    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 2.5fr 1.2fr;
      grid-template-rows: 100%;
      gap: 10px;
      padding: 10px 14px 10px 10px;
      box-sizing: border-box;
      background: radial-gradient(circle at top right, #111826 0, #05070b 45%, #000 100%);
    }

    .center-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* VIEWPORT (VIDEO + OVERLAY) */

    .video-main {
      flex: 1;
      position: relative;
      background: #000;
      border-radius: 4px;
      border: 2px solid #3c4a5f;
      box-shadow: 0 0 0 1px #0b1019, 0 0 14px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .video-main::before {
      /* top status bar like PACS monitors */
      content: "LIVE VIEW • OR-1 • 1920×1080";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      padding: 0 8px;
      display: flex;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      background: linear-gradient(to right, #05070b, #050b14);
      color: var(--text-muted);
      border-bottom: 1px solid #1a2230;
      z-index: 5;
    }

    .video-main img,
    .video-main video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }

    .overlay {
      position: absolute;
      top: 22px;      /* below the status bar */
      left: 0;
      pointer-events: auto;
    }

    /* BUTTONS / CONTROLS */

    .controls {
      display: flex;
      gap: 6px;
      justify-content: space-between;
      padding: 6px 0 0 0;
    }

    .btn {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid #151a24;
      background: #0b1019;
      color: var(--text-main);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
    }

    .btn:hover {
      border-color: var(--accent-soft);
      box-shadow: 0 0 0 1px var(--accent-soft);
    }

    .btn.start {
      border-color: var(--success);
      color: var(--success);
    }

    .btn.stop {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn.live {
      border-color: var(--accent-strong);
      color: var(--accent-strong);
    }

    .btn.secondary {
      padding: 2px 6px;
      font-size: 11px;
      border-radius: 999px;
    }

    /* RIGHT ANALYTICS COLUMN */

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .card {
      flex: 1;
      background: var(--bg-panel);
      border-radius: 4px;
      padding: 8px 10px;
      font-size: 12px;
      border: 1px solid var(--border-subtle);
      box-shadow: inset 0 0 0 1px #05070b;
      display: flex;
      flex-direction: column;
    }

    .card h3 {
      margin: 0 0 6px 0;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .small-text {
      font-size: 11px;
      color: var(--text-muted);
    }

    #stabilityChart {
      background: #05070b;
      border-radius: 3px;
      border: 1px solid #151a24;
    }

    /* LINKS */

    a {
      color: inherit;
      text-decoration: none;
    }

    /* POPUP STYLES */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--bg-panel);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      z-index: 1000;
      display: none;
      font-size: 16px;
      text-align: center;
      color: var(--text-main);
      min-width: 200px;
    }

    .popup-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      z-index: 999;
      display: none;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--accent);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Basic scrollbars to match dark theme */

    .recordings-list::-webkit-scrollbar {
      width: 6px;
    }
    .recordings-list::-webkit-scrollbar-track {
      background: #05070b;
    }
    .recordings-list::-webkit-scrollbar-thumb {
      background: #222733;
    }
  </style>
</head>
<body>

  <!-- Left: recordings list -->
  <div class="sidebar">
    <h1>Recordings</h1>
    <div class="recordings-list" id="recordings-list">
      {% for name in recordings %}
      <div class="recording-item" onclick="playRecording('{{ name }}')">
        <span class="recording-name">{{ name }}</span>
        <button class="btn" onclick="event.stopPropagation(); downloadRecording('{{ name }}')">↓</button>
      </div>
      {% endfor %}
    </div>

    <h2>Recording Control</h2>
    <div class="controls">
      <button class="btn start" id="play-btn" onclick="togglePlay()">Start</button>
      <!-- <button class="btn stop" onclick="stopCase()">Stop</button> -->
      <button class="btn live" onclick="showLive()">Live</button>
    </div>
  </div>

  <!-- Center + right -->
  <div class="main">
    <!-- Center: live or playback -->
    <div class="center-panel">
      <div class="video-main" id="video-container">
        <!-- live stream by default -->
        <img id="live-stream" src="/video" alt="Live OR view">
        <video id="playback" controls style="display:none;"></video>
        <canvas id="overlay" class="overlay"></canvas>
      </div>
    </div>

    <!-- Right: 3 analytic placeholder cards -->
    <div class="right-panel">
      <div class="card">
        <h3>Motion Metrics</h3>
        <canvas id="stabilityChart" width="400" height="200"></canvas>
      </div>
      <div class="card">
        <h3>Lighting Stability</h3>
        <p class="small-text">
          Placeholder for brightness over time and anti-shadow adjustments.
        </p>
      </div>
      <div class="card">
        <h3>Arm Controls</h3>
        <div style="display: flex; flex-direction: column; gap: 12px;">
          <button class="btn live" id="reset-btn" onclick="resetSystem()" style="border-color: var(--strong-accent);">Reset</button>
          <button class="btn start" id="enable-btn" onclick="toggleEnable()">Enable</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Popup for reset -->
  <div id="reset-popup-backdrop" class="popup-backdrop"></div>
  <div id="reset-popup" class="popup">
    Initializing
    <div class="spinner"></div>
  </div>

  <script>
    const socket = io();
    let points = [];
    let startTime = Date.now();
    const canvas = document.getElementById('stabilityChart');
    const ctx = canvas.getContext('2d');

    // Overlay for target
    const img = document.getElementById('live-stream');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    let currentTarget = {x: 0, y: 10}; // default center in transformed space
    let isDragging = false;
    let dragOffset = {x: 0, y: 0};

    function resizeOverlay() {
      overlay.width = img.clientWidth;
      overlay.height = img.clientHeight;
      drawTarget();
    }

    function drawTarget() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      overlayCtx.setLineDash([5, 5]);
      overlayCtx.strokeStyle = 'yellow';
      overlayCtx.lineWidth = 2;
      overlayCtx.beginPath();
      const drawX = ((15 - currentTarget.x) / 30.2) * overlay.width;
      const drawY = (currentTarget.y / 20) * overlay.height;
      overlayCtx.arc(drawX, drawY, 20, 0, 2 * Math.PI);
      overlayCtx.stroke();
    }

    img.onload = resizeOverlay;
    window.addEventListener('resize', resizeOverlay);

    overlay.addEventListener('mousedown', (e) => {
      const rect = overlay.getBoundingClientRect();
      const mouseX = (1 - (e.clientX - rect.left) / rect.width) * 30.2 - 15;
      const mouseY = ((e.clientY - rect.top) / rect.height) * 20;
      const dist = Math.sqrt((mouseX - currentTarget.x)**2 + (mouseY - currentTarget.y)**2);
      if (dist < 1) {  // since radius in coord space is small
        isDragging = true;
        dragOffset.x = mouseX - currentTarget.x;
        dragOffset.y = mouseY - currentTarget.y;
      }
    });

    overlay.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const rect = overlay.getBoundingClientRect();
        const mouseX = (1 - (e.clientX - rect.left) / rect.width) * 30.2 - 15;
        const mouseY = ((e.clientY - rect.top) / rect.height) * 20;
        currentTarget.x = mouseX - dragOffset.x;
        currentTarget.y = mouseY - dragOffset.y;
        drawTarget();
      }
    });

    overlay.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        fetch('/update_target', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({x: currentTarget.x, y: currentTarget.y})
        });
      }
    });

    socket.on('target_update', function(data) {
      currentTarget.x = data.x;
      currentTarget.y = data.y;
      drawTarget();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Draw shaky zone (red background for values > 30)
      let shakyHeight = (70 / 100) * canvas.height;
      ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
      ctx.fillRect(0, 0, canvas.width, shakyHeight);
      // Add label
      ctx.fillStyle = 'red';
      ctx.font = '12px Arial';
      ctx.fillText('Shaky', 5, 15);
      if (points.length < 2) return;
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        let x = ((points[i].time - startTime) / 15000) * canvas.width;
        let y = (points[i].value / 100) * canvas.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'green';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    socket.on('stability_update', function(data) {
      points.push({time: Date.now(), value: data.metric});
      // remove old points older than 15 seconds
      let now = Date.now();
      while (points.length > 0 && now - points[0].time > 15000) {
        points.shift();
      }
      if (points.length > 0) startTime = points[0].time;
      draw();
    });

    async function refreshRecordings() {
      const res = await fetch('/recordings');
      const files = await res.json();
      const list = document.getElementById('recordings-list');
      list.innerHTML = '';
      files.forEach(name => {
        const div = document.createElement('div');
        div.className = 'recording-item';
        div.onclick = () => playRecording(name);

        const span = document.createElement('span');
        span.className = 'recording-name';
        span.textContent = name;

        const btn = document.createElement('button');
        btn.className = 'btn secondary';
        btn.textContent = '↓';
        btn.onclick = (e) => {
          e.stopPropagation();
          downloadRecording(name);
        };

        div.appendChild(span);
        div.appendChild(btn);
        list.appendChild(div);
      });
    }

    
    let isPlaying = false;
    function togglePlay() {
      const btn = document.getElementById('play-btn');
      if (isPlaying) {
        // Disable
        stopCase();
        btn.textContent = 'Play';
        btn.classList.remove('stop');
        btn.classList.add('start');
      } else {
        // Enable
        startCase();
        btn.textContent = 'Pause';
        btn.classList.remove('start');
        btn.classList.add('stop');
      }
      isPlaying = !isPlaying;
    }


    async function startCase() {
      await fetch('/start_case', { method: 'POST' });
      await refreshRecordings();
    }

    async function stopCase() {
      await fetch('/stop_case', { method: 'POST' });
      await refreshRecordings();
    }

    function showLive() {
      const img = document.getElementById('live-stream');
      const vid = document.getElementById('playback');
      img.style.display = 'block';
      vid.style.display = 'none';
      vid.pause();
    }

    function playRecording(name) {
      const img = document.getElementById('live-stream');
      const vid = document.getElementById('playback');
      img.style.display = 'none';
      vid.style.display = 'block';
      vid.src = '/play/' + encodeURIComponent(name);
      console.log(vid.src);
      vid.load();
      vid.play();
    }

    function downloadRecording(name) {
      window.location.href = '/download/' + encodeURIComponent(name);
    }

    // Reset and Enable/Disable functions
    let isEnabled = false;

    function resetSystem() {
      // Dummy reset function
      console.log('Reset system called');
      
      // Show popup and backdrop
      const popup = document.getElementById('reset-popup');
      const backdrop = document.getElementById('reset-popup-backdrop');
      popup.style.display = 'block';
      backdrop.style.display = 'block';
      
      // Hide after 5 seconds
      setTimeout(() => {
        popup.style.display = 'none';
        backdrop.style.display = 'none';
      }, 5000);
    }

    function toggleEnable() {
      const btn = document.getElementById('enable-btn');
      if (isEnabled) {
        // Disable
        disableSystem();
        btn.textContent = 'Enable';
        btn.classList.remove('stop');
        btn.classList.add('start');
      } else {
        // Enable
        enableSystem();
        btn.textContent = 'Disable';
        btn.classList.remove('start');
        btn.classList.add('stop');
      }
      isEnabled = !isEnabled;
    }

    function enableSystem() {
      // Dummy enable function
      console.log('System enabled');
    }

    function disableSystem() {
      // Dummy disable function
      console.log('System disabled');
    }
  </script>

</body>
</html>
