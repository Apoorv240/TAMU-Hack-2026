<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart OR Lighting Console</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f8ff;
      color: #333;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }
    .sidebar {
      width: 280px;
      background: #e0f7fa;
      padding: 20px;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 15px;
      border-right: 2px solid #007bff;
    }
    .sidebar h1 {
      font-size: 20px;
      margin: 0 0 10px 0;
      color: #007bff;
    }
    .sidebar h2 {
      font-size: 16px;
      margin: 20px 0 8px 0;
      color: #0056b3;
    }
    .recordings-list {
      flex: 1;
      overflow-y: auto;
      border-radius: 8px;
      background: #fff;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ccc;
    }
    .recording-item {
      padding: 8px 10px;
      margin-bottom: 6px;
      border-radius: 6px;
      cursor: pointer;
      background: #f8f9fa;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #dee2e6;
    }
    .recording-item:hover {
      background: #e9ecef;
    }
    .recording-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 150px;
    }
    .main {
      flex: 1;
      display: grid;
      grid-template-columns: 2fr 1fr;
      grid-template-rows: 100%;
      gap: 15px;
      padding: 20px;
      box-sizing: border-box;
    }
    .center-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .video-main {
      flex: 1;
      background: #000;
      border-radius: 10px;
      border: 3px solid #007bff;
      overflow: hidden;
      position: relative;
    }
    .video-main img,
    .video-main video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #000;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: auto;
    }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      color: #fff;
      border: none;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: background 0.3s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn.start {
      background: #28a745;
    }
    .btn.stop {
      background: #dc3545;
    }
    .btn.live {
      background: #007bff;
    }
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .card {
      flex: 1;
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-sizing: border-box;
      font-size: 14px;
      border: 2px solid #007bff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #007bff;
    }
    .small-text {
      font-size: 13px;
      color: #666;
    }
    a {
      color: inherit;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Left: recordings list -->
  <div class="sidebar">
    <h1>Recordings</h1>
    <div class="recordings-list" id="recordings-list">
      {% for name in recordings %}
      <div class="recording-item" onclick="playRecording('{{ name }}')">
        <span class="recording-name">{{ name }}</span>
        <button class="btn" onclick="event.stopPropagation(); downloadRecording('{{ name }}')">↓</button>
      </div>
      {% endfor %}
    </div>

    <h2>Recording Control</h2>
    <div class="controls">
      <button class="btn start" onclick="startCase()">Start</button>
      <button class="btn stop" onclick="stopCase()">Stop</button>
      <button class="btn live" onclick="showLive()">Live</button>
    </div>
  </div>

  <!-- Center + right -->
  <div class="main">
    <!-- Center: live or playback -->
    <div class="center-panel">
      <div class="video-main" id="video-container">
        <!-- live stream by default -->
        <img id="live-stream" src="/video" alt="Live OR view">
        <video id="playback" controls style="display:none;"></video>
        <canvas id="overlay" class="overlay"></canvas>
      </div>
    </div>

    <!-- Right: 3 analytic placeholder cards -->
    <div class="right-panel">
      <div class="card">
        <h3>Motion Metrics</h3>
        <canvas id="stabilityChart" width="400" height="200"></canvas>
      </div>
      <div class="card">
        <h3>Lighting Stability</h3>
        <p class="small-text">
          Placeholder for brightness over time and anti-shadow adjustments.
        </p>
      </div>
      <div class="card">
        <h3>Case Summary</h3>
        <p class="small-text">
          Placeholder for total duration, number of light interactions, and mode usage.
        </p>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let points = [];
    let startTime = Date.now();
    const canvas = document.getElementById('stabilityChart');
    const ctx = canvas.getContext('2d');

    // Overlay for target
    const img = document.getElementById('live-stream');
    const overlay = document.getElementById('overlay');
    const overlayCtx = overlay.getContext('2d');
    let currentTarget = {x: 0, y: 10}; // default center in transformed space
    let isDragging = false;
    let dragOffset = {x: 0, y: 0};

    function resizeOverlay() {
      overlay.width = img.clientWidth;
      overlay.height = img.clientHeight;
      drawTarget();
    }

    function drawTarget() {
      overlayCtx.clearRect(0, 0, overlay.width, overlay.height);
      overlayCtx.setLineDash([5, 5]);
      overlayCtx.strokeStyle = 'yellow';
      overlayCtx.lineWidth = 2;
      overlayCtx.beginPath();
      const drawX = ((15 - currentTarget.x) / 30.2) * overlay.width;
      const drawY = (currentTarget.y / 20) * overlay.height;
      overlayCtx.arc(drawX, drawY, 20, 0, 2 * Math.PI);
      overlayCtx.stroke();
    }

    img.onload = resizeOverlay;
    window.addEventListener('resize', resizeOverlay);

    overlay.addEventListener('mousedown', (e) => {
      const rect = overlay.getBoundingClientRect();
      const mouseX = (1 - (e.clientX - rect.left) / rect.width) * 30.2 - 15;
      const mouseY = ((e.clientY - rect.top) / rect.height) * 20;
      const dist = Math.sqrt((mouseX - currentTarget.x)**2 + (mouseY - currentTarget.y)**2);
      if (dist < 1) {  // since radius in coord space is small
        isDragging = true;
        dragOffset.x = mouseX - currentTarget.x;
        dragOffset.y = mouseY - currentTarget.y;
      }
    });

    overlay.addEventListener('mousemove', (e) => {
      if (isDragging) {
        const rect = overlay.getBoundingClientRect();
        const mouseX = (1 - (e.clientX - rect.left) / rect.width) * 30.2 - 15;
        const mouseY = ((e.clientY - rect.top) / rect.height) * 20;
        currentTarget.x = mouseX - dragOffset.x;
        currentTarget.y = mouseY - dragOffset.y;
        drawTarget();
      }
    });

    overlay.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        fetch('/update_target', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({x: currentTarget.x, y: currentTarget.y})
        });
      }
    });

    socket.on('target_update', function(data) {
      currentTarget.x = data.x;
      currentTarget.y = data.y;
      drawTarget();
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Draw shaky zone (red background for values > 30)
      let shakyHeight = (70 / 100) * canvas.height;
      ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
      ctx.fillRect(0, 0, canvas.width, shakyHeight);
      // Add label
      ctx.fillStyle = 'red';
      ctx.font = '12px Arial';
      ctx.fillText('Shaky', 5, 15);
      if (points.length < 2) return;
      ctx.beginPath();
      for (let i = 0; i < points.length; i++) {
        let x = ((points[i].time - startTime) / 15000) * canvas.width;
        let y = (points[i].value / 100) * canvas.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = 'green';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    socket.on('stability_update', function(data) {
      points.push({time: Date.now(), value: data.metric});
      // remove old points older than 15 seconds
      let now = Date.now();
      while (points.length > 0 && now - points[0].time > 15000) {
        points.shift();
      }
      if (points.length > 0) startTime = points[0].time;
      draw();
    });

    async function refreshRecordings() {
      const res = await fetch('/recordings');
      const files = await res.json();
      const list = document.getElementById('recordings-list');
      list.innerHTML = '';
      files.forEach(name => {
        const div = document.createElement('div');
        div.className = 'recording-item';
        div.onclick = () => playRecording(name);

        const span = document.createElement('span');
        span.className = 'recording-name';
        span.textContent = name;

        const btn = document.createElement('button');
        btn.className = 'btn secondary';
        btn.textContent = '↓';
        btn.onclick = (e) => {
          e.stopPropagation();
          downloadRecording(name);
        };

        div.appendChild(span);
        div.appendChild(btn);
        list.appendChild(div);
      });
    }

    async function startCase() {
      await fetch('/start_case', { method: 'POST' });
      await refreshRecordings();
    }

    async function stopCase() {
      await fetch('/stop_case', { method: 'POST' });
      await refreshRecordings();
    }

    function showLive() {
      const img = document.getElementById('live-stream');
      const vid = document.getElementById('playback');
      img.style.display = 'block';
      vid.style.display = 'none';
      vid.pause();
    }

    function playRecording(name) {
      const img = document.getElementById('live-stream');
      const vid = document.getElementById('playback');
      img.style.display = 'none';
      vid.style.display = 'block';
      vid.src = '/play/' + encodeURIComponent(name);
      console.log(vid.src);
      vid.load();
      vid.play();
    }

    function downloadRecording(name) {
      window.location.href = '/download/' + encodeURIComponent(name);
    }
  </script>

</body>
</html>
